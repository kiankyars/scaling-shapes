[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdr"
version = "0.1.0"
description = "Memorization Dose Response — controlled canary-injection pretraining."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.46",
  "datasets>=3.0",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mdr*"]
