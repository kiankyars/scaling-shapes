[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-shapes"
version = "0.1.0"
description = "Per-capability scaling laws across the Pythia checkpoint grid."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.46",
  "lm-eval>=0.4.5",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "huggingface_hub>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scaling_shapes*"]
